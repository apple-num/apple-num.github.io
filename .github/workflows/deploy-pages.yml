name: Deploy site to Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'worker/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 서버 코드와 저장소 메타 파일은 사이트에서 제외
      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r index.html css js shared assets .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
