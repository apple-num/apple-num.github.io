name: Deploy ranking worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'shared/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: apple-num-db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install wrangler
        run: npm install -g wrangler@4

      # D1이 없으면 만들고, 있으면 그 ID를 wrangler.toml에 채워 넣습니다.
      - name: Ensure D1 database
        run: |
          find_id() { wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid'; }
          ID="$(find_id)"
          if [ -z "$ID" ]; then
            echo "Creating D1 database $DB_NAME"
            wrangler d1 create "$DB_NAME"
            ID="$(find_id)"
          fi
          if [ -z "$ID" ]; then echo "D1 database id not found" >&2; exit 1; fi
          echo "Using D1 database $ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml

      - name: Apply migrations
        run: wrangler d1 migrations apply "$DB_NAME" --remote

      - name: Deploy worker
        run: wrangler deploy
